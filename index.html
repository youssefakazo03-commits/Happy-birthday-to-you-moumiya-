<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Happy Birthday, Soumia ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#030003;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  color:#fff;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#030003;
}

.scene{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  opacity:0;
  visibility:hidden;
  transform:scale(1.08);
  transition:
    opacity 1s ease,
    transform 1.2s ease,
    visibility 1s;
}

.scene.active{
  opacity:1;
  visibility:visible;
  transform:scale(1);
  z-index:5;
}

.scene.exit{
  opacity:0;
  transform:scale(.92);
}


/* =====================================================
   النجوم العامة
===================================================== */

.stars{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.star{
  position:absolute;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px #fff;
  animation:twinkle var(--duration) ease-in-out infinite;
  animation-delay:var(--delay);
}

@keyframes twinkle{
  0%,100%{
    opacity:.15;
    transform:scale(.5);
  }

  50%{
    opacity:1;
    transform:scale(1.5);
  }
}


/* =====================================================
   القلوب الطائرة العامة
===================================================== */

.floating-heart{
  position:absolute;
  color:#ff174f;
  text-shadow:
    0 0 8px #ff174f,
    0 0 20px #ff174f;
  opacity:0;
  animation:floatHeart var(--speed) linear infinite;
  animation-delay:var(--delay);
}

@keyframes floatHeart{

  0%{
    transform:
      translateY(110vh)
      translateX(0)
      rotate(0deg)
      scale(.5);
    opacity:0;
  }

  10%{
    opacity:.9;
  }

  90%{
    opacity:.7;
  }

  100%{
    transform:
      translateY(-20vh)
      translateX(var(--move))
      rotate(360deg)
      scale(1.3);
    opacity:0;
  }
}


/* =====================================================
   المشهد 1
===================================================== */

#scene1{
  background:
    radial-gradient(
      circle at center,
      rgba(110,0,45,.6),
      transparent 45%
    ),
    linear-gradient(
      145deg,
      #030003,
      #250012,
      #030003
    );
}

.gift-card{
  position:relative;
  width:min(86vw,440px);
  padding:45px 28px;
  border:1px solid rgba(255,215,150,.4);
  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      rgba(80,0,35,.85),
      rgba(10,0,10,.9)
    );

  box-shadow:
    0 0 30px rgba(150,0,55,.5),
    inset 0 0 40px rgba(255,255,255,.03);

  text-align:center;
  backdrop-filter:blur(12px);

  animation:cardFloat 4s ease-in-out infinite;
}

.gift-card::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(255,215,150,.12);
  border-radius:24px;
}

@keyframes cardFloat{
  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }
}

.gift-heart{
  width:105px;
  height:105px;
  margin:0 auto 30px;
  position:relative;
  transform:rotate(-45deg);
  background:linear-gradient(145deg,#ff174f,#760020);
  box-shadow:
    0 0 20px #ff174f,
    0 0 60px rgba(255,0,70,.6);
  animation:heartPulse 1.7s infinite ease-in-out;
}

.gift-heart::before,
.gift-heart::after{
  content:"";
  position:absolute;
  width:105px;
  height:105px;
  border-radius:50%;
  background:inherit;
}

.gift-heart::before{
  top:-52px;
  left:0;
}

.gift-heart::after{
  left:52px;
  top:0;
}

@keyframes heartPulse{
  0%,100%{
    transform:rotate(-45deg) scale(1);
  }

  50%{
    transform:rotate(-45deg) scale(1.1);
  }
}

.click-text{
  position:relative;
  z-index:2;
  font-size:clamp(25px,6vw,38px);
  font-weight:bold;
  color:#fff;
  cursor:pointer;
  text-shadow:
    0 0 15px #fff,
    0 0 30px #ff174f;
}

.subtitle{
  position:relative;
  z-index:2;
  margin-top:15px;
  color:#d7b8c3;
  font-size:14px;
}


/* =====================================================
   المشهد 2 — CODE
===================================================== */

#scene2{
  background:#030003;
}

.code-window{
  width:min(90vw,760px);
  height:min(72vh,500px);
  background:#08090d;
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  box-shadow:0 0 70px rgba(160,0,55,.4);
  overflow:hidden;
  direction:ltr;
  position:relative;
}

.window-bar{
  height:42px;
  background:#111217;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 15px;
}

.dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#555;
}

.code{
  padding:22px;
  color:#b8bdc8;
  font-family:monospace;
  font-size:clamp(11px,2vw,15px);
  line-height:1.7;
}

.code-line{
  opacity:0;
  animation:codeIn .4s forwards;
}

@keyframes codeIn{
  to{
    opacity:1;
  }
}

.keyword{
  color:#ff6b9d;
}

.string{
  color:#e6d889;
}

.function{
  color:#82d8ff;
}

.code-heart{
  position:absolute;
  left:50%;
  top:53%;
  width:125px;
  height:125px;
  transform:translate(-50%,-50%) rotate(-45deg);
  border:4px solid #ff174f;
  box-shadow:
    0 0 10px #ff174f,
    0 0 35px #ff174f,
    inset 0 0 20px #ff174f;
  opacity:0;
  animation:codeHeart 4s 1.2s forwards;
}

.code-heart::before,
.code-heart::after{
  content:"";
  position:absolute;
  width:125px;
  height:125px;
  border:4px solid #ff174f;
  border-radius:50%;
}

.code-heart::before{
  top:-65px;
  left:-4px;
}

.code-heart::after{
  left:60px;
  top:-4px;
}

@keyframes codeHeart{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      rotate(-45deg)
      scale(.2);
  }

  60%{
    opacity:1;
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      rotate(-45deg)
      scale(1);
  }
}

.soumia-code{
  position:absolute;
  left:50%;
  top:53%;
  transform:translate(-50%,-50%);
  font-size:clamp(25px,7vw,55px);
  font-weight:bold;
  color:white;
  text-shadow:
    0 0 15px #ff174f,
    0 0 35px #ff174f;
  opacity:0;
  animation:soumiaAppear 1s 5.1s forwards;
  direction:ltr;
}

@keyframes soumiaAppear{
  to{
    opacity:1;
  }
}


/* =====================================================
   Matrix
===================================================== */

.matrix-scene{
  background:#000;
}

.matrix{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:#000;
}

.matrix-column{
  position:absolute;
  top:-120%;
  color:#ff174f;
  font-family:monospace;
  font-size:clamp(13px,2vw,22px);
  line-height:1.2;
  writing-mode:vertical-rl;
  text-shadow:0 0 8px #ff174f;
  animation:matrixFall var(--fall) linear infinite;
  opacity:.65;
}

@keyframes matrixFall{
  to{
    transform:translateY(230vh);
  }
}

.matrix-center{
  position:relative;
  z-index:3;
  font-size:clamp(130px,35vw,300px);
  font-weight:900;
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 30px #ff174f,
    0 0 80px #ff174f;
  animation:numberPulse .8s infinite alternate;
}

@keyframes numberPulse{
  from{
    transform:scale(.94);
  }

  to{
    transform:scale(1.05);
  }
}


/* =====================================================
   المشاهد الرومانسية
===================================================== */

.romantic-bg{
  background:
    radial-gradient(
      circle at center,
      rgba(110,0,45,.5),
      transparent 45%
    ),
    #050005;
}

.big-heart{
  position:relative;
  width:min(42vw,280px);
  height:min(42vw,280px);
  min-width:190px;
  min-height:190px;
  background:linear-gradient(145deg,#ff174f,#68001f);
  transform:rotate(-45deg);
  border-radius:10px;

  box-shadow:
    0 0 20px #ff174f,
    0 0 60px #ff174f,
    0 0 130px rgba(255,0,60,.55);

  animation:bigHeart 1.4s ease-in-out infinite alternate;
}

.big-heart::before,
.big-heart::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:inherit;
  border-radius:50%;
}

.big-heart::before{
  top:-50%;
  left:0;
}

.big-heart::after{
  left:50%;
  top:0;
}

@keyframes bigHeart{
  from{
    transform:rotate(-45deg) scale(1);
  }

  to{
    transform:rotate(-45deg) scale(1.08);
  }
}

.heart-name{
  position:absolute;
  z-index:3;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(45deg);
  width:280px;
  text-align:center;
  font-size:clamp(27px,7vw,52px);
  font-weight:bold;
  color:white;
  text-shadow:
    0 0 10px white,
    0 0 30px #ff174f;
  direction:ltr;
}


/* =====================================================
   الألعاب النارية
===================================================== */

.fireworks{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.firework{
  position:absolute;
  bottom:-20px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 10px white;
  animation:fireworkLaunch 2.5s infinite ease-out;
}

.firework::after{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  left:-48px;
  top:-48px;
  border-radius:50%;
  border:2px solid rgba(255,30,80,.7);
  transform:scale(.1);
  opacity:0;
  animation:burst 2.5s infinite ease-out;
}

@keyframes fireworkLaunch{

  0%{
    bottom:-20px;
    opacity:0;
  }

  15%{
    opacity:1;
  }

  55%{
    bottom:50%;
    opacity:1;
  }

  60%,100%{
    bottom:52%;
    opacity:0;
  }
}

@keyframes burst{

  55%{
    transform:scale(.1);
    opacity:0;
  }

  65%{
    transform:scale(1);
    opacity:1;
  }

  100%{
    transform:scale(1.8);
    opacity:0;
  }
}


/* =====================================================
   قلب الكلمات
===================================================== */

.word-heart{
  position:relative;
  width:min(90vw,600px);
  height:min(75vh,500px);
}

.love-word{
  position:absolute;
  color:#ffb2c4;
  font-weight:bold;
  font-size:clamp(8px,1.7vw,15px);
  opacity:0;
  text-shadow:0 0 8px #ff174f;
  animation:wordAppear .8s forwards;
  direction:ltr;
  white-space:nowrap;
}

@keyframes wordAppear{

  from{
    opacity:0;
    transform:scale(.2) rotate(-20deg);
  }

  to{
    opacity:1;
    transform:scale(1) rotate(0);
  }
}


/* =====================================================
   النصوص
===================================================== */

.text-scene{
  text-align:center;
  position:relative;
  z-index:5;
  width:90%;
}

.main-title{
  font-size:clamp(32px,8vw,75px);
  font-weight:900;
  line-height:1.25;
  direction:ltr;
  color:white;
  text-shadow:
    0 0 8px white,
    0 0 25px #ff174f,
    0 0 60px #ff174f;
  animation:titleGlow 2s infinite alternate;
}

.arabic-title{
  font-size:clamp(23px,5vw,42px);
  color:white;
  margin-top:22px;
  text-shadow:0 0 20px #ff174f;
  line-height:1.6;
}

.gold{
  color:#f1d49a;
  text-shadow:0 0 12px rgba(241,212,154,.7);
}

@keyframes titleGlow{
  from{
    filter:brightness(.9);
  }

  to{
    filter:brightness(1.3);
  }
}


/* =====================================================
   القمر القديم للمشاهد الأخرى
===================================================== */

.moon{
  position:absolute;
  width:clamp(100px,18vw,180px);
  height:clamp(100px,18vw,180px);
  border-radius:50%;
  background:#fff5dc;
  box-shadow:
    0 0 25px white,
    0 0 80px rgba(255,245,220,.35);
  top:10%;
  left:10%;
}

.moon::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  background:#10000a;
  left:35px;
  top:-15px;
}


/* =====================================================
   FINAL SCENE
===================================================== */

.final-scene{

  background:
    radial-gradient(
      circle at 50% 48%,
      rgba(125,0,45,.48),
      rgba(35,0,18,.8) 38%,
      #030003 78%
    );

  overflow:hidden;
}


/* النجوم */

.final-stars{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.final-star{
  position:absolute;
  border-radius:50%;
  background:#fff;

  box-shadow:
    0 0 5px #fff,
    0 0 14px rgba(255,255,255,.8);

  animation:
    finalStarTwinkle var(--starTime) ease-in-out infinite;

  animation-delay:var(--starDelay);
}

@keyframes finalStarTwinkle{

  0%,100%{
    opacity:.15;
    transform:scale(.5);
  }

  50%{
    opacity:1;
    transform:scale(1.5);
  }
}


/* القمر */

.final-moon{

  position:absolute;

  width:clamp(110px,18vw,190px);
  height:clamp(110px,18vw,190px);

  top:7%;
  left:8%;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #fff,
      #fff5d7 48%,
      #e8d8b7 100%
    );

  box-shadow:
    0 0 20px #fff,
    0 0 55px rgba(255,245,210,.5),
    0 0 110px rgba(255,245,210,.2);

  animation:moonFloat 7s ease-in-out infinite;

  z-index:2;
}

.final-moon::after{

  content:"";

  position:absolute;

  width:100%;
  height:100%;

  border-radius:50%;

  background:#12000a;

  left:35px;
  top:-14px;
}

.moon-crater{
  position:absolute;
  border-radius:50%;
  background:rgba(130,110,90,.18);
  z-index:2;
}

.crater1{
  width:22px;
  height:22px;
  left:35%;
  top:25%;
}

.crater2{
  width:14px;
  height:14px;
  left:25%;
  top:55%;
}

.crater3{
  width:28px;
  height:28px;
  left:55%;
  top:60%;
}

@keyframes moonFloat{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-10px);
  }
}


/* هالة القلب */

.heart-aura{

  position:absolute;

  width:min(65vw,470px);
  height:min(65vw,470px);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(255,0,70,.35),
      rgba(130,0,40,.12) 45%,
      transparent 70%
    );

  filter:blur(15px);

  animation:auraPulse 3s ease-in-out infinite;

  z-index:1;
}

@keyframes auraPulse{

  0%,100%{
    transform:scale(.9);
    opacity:.55;
  }

  50%{
    transform:scale(1.12);
    opacity:1;
  }
}


/* القلب النهائي */

.final-big-heart{

  position:absolute;

  width:min(34vw,280px);
  height:min(34vw,280px);

  min-width:190px;
  min-height:190px;

  background:
    linear-gradient(
      145deg,
      #ff315e 0%,
      #d5003c 35%,
      #72001f 75%,
      #35000f 100%
    );

  transform:rotate(-45deg);

  border-radius:18px;

  box-shadow:

    0 0 15px #ff174f,
    0 0 40px #ff174f,
    0 0 90px rgba(255,0,70,.7),
    0 0 160px rgba(120,0,45,.5),

    inset -25px -25px 45px rgba(0,0,0,.45),
    inset 15px 15px 25px rgba(255,255,255,.12);

  animation:finalHeartPulse 3s ease-in-out infinite;

  z-index:3;
}

.final-big-heart::before,
.final-big-heart::after{

  content:"";

  position:absolute;

  width:100%;
  height:100%;

  border-radius:50%;

  background:inherit;
}

.final-big-heart::before{
  top:-50%;
  left:0;
}

.final-big-heart::after{
  top:0;
  left:50%;
}


/* لمعان القلب */

.heart-shine{

  position:absolute;

  width:45%;
  height:18%;

  top:15%;
  left:18%;

  background:rgba(255,255,255,.45);

  border-radius:50%;

  filter:blur(8px);

  z-index:5;

  transform:rotate(45deg);
}

@keyframes finalHeartPulse{

  0%,100%{
    transform:rotate(-45deg) scale(1);
  }

  50%{
    transform:rotate(-45deg) scale(1.08);
  }
}


/* رسالة النهاية */

.final-message{

  position:absolute;

  z-index:10;

  text-align:center;

  width:95%;

  pointer-events:none;
}

.final-title{

  font-size:clamp(28px,7vw,72px);

  font-weight:900;

  direction:ltr;

  color:white;

  letter-spacing:1px;

  text-shadow:
    0 0 8px #fff,
    0 0 20px #ff174f,
    0 0 45px #ff174f,
    0 0 90px rgba(255,0,70,.8);

  animation:finalTitleGlow 3s ease-in-out infinite;
}

.final-date{

  margin-top:22px;

  font-size:clamp(20px,4.5vw,38px);

  color:#f2d69b;

  direction:ltr;

  text-shadow:
    0 0 10px rgba(242,214,155,.7),
    0 0 25px rgba(242,214,155,.35);
}

.final-line{

  margin-top:20px;

  font-size:clamp(15px,3vw,25px);

  color:white;

  opacity:.85;

  text-shadow:0 0 10px #ff174f;

  animation:lineGlow 2.5s ease-in-out infinite;
}

@keyframes finalTitleGlow{

  0%,100%{
    filter:brightness(.9);
  }

  50%{
    filter:brightness(1.35);
  }
}

@keyframes lineGlow{

  0%,100%{
    opacity:.55;
  }

  50%{
    opacity:1;
  }
}


/* القلوب النهائية */

.final-floating-heart{

  position:absolute;

  color:#ff174f;

  font-size:var(--heartSize);

  text-shadow:
    0 0 7px #ff174f,
    0 0 20px #ff174f;

  opacity:0;

  animation:
    finalHeartFloat var(--heartSpeed) linear infinite;

  animation-delay:var(--heartDelay);

  z-index:4;
}

@keyframes finalHeartFloat{

  0%{
    transform:
      translateY(110vh)
      translateX(0)
      rotate(0deg)
      scale(.5);
    opacity:0;
  }

  10%{
    opacity:.9;
  }

  80%{
    opacity:.8;
  }

  100%{
    transform:
      translateY(-15vh)
      translateX(var(--heartMove))
      rotate(360deg)
      scale(1.3);
    opacity:0;
  }
}


/* الورود */

.final-roses span{

  position:absolute;

  font-size:clamp(30px,6vw,65px);

  filter:
    drop-shadow(0 0 12px rgba(255,0,60,.8));

  z-index:6;

  animation:roseSway 4s ease-in-out infinite;
}

.final-roses span:nth-child(1){
  left:4%;
  bottom:7%;
}

.final-roses span:nth-child(2){
  right:4%;
  bottom:8%;
  animation-delay:1s;
}

.final-roses span:nth-child(3){
  left:12%;
  top:18%;
  font-size:35px;
  animation-delay:2s;
}

.final-roses span:nth-child(4){
  right:12%;
  top:22%;
  font-size:35px;
  animation-delay:1.5s;
}

@keyframes roseSway{

  0%,100%{
    transform:translateY(0) rotate(-5deg);
  }

  50%{
    transform:translateY(-12px) rotate(6deg);
  }
}


/* الألعاب النارية النهائية */

.final-fireworks{

  position:absolute;

  inset:0;

  pointer-events:none;

  z-index:7;
}

.final-firework{

  position:absolute;

  bottom:-20px;

  width:5px;
  height:5px;

  border-radius:50%;

  background:white;

  box-shadow:
    0 0 8px white,
    0 0 20px #ff174f;

  animation:
    fireworkRise 3.5s infinite ease-out;
}

.final-firework::before{

  content:"";

  position:absolute;

  width:5px;
  height:5px;

  left:0;
  top:0;

  border-radius:50%;

  box-shadow:
    0 -65px 0 #fff,
    0 65px 0 #ff174f,
    65px 0 0 #fff,
    -65px 0 0 #ff174f,
    46px 46px 0 #fff,
    -46px -46px 0 #ff174f,
    46px -46px 0 #fff,
    -46px 46px 0 #ff174f;

  opacity:0;

  animation:
    fireworksBurst 3.5s infinite ease-out;
}

.fw1{
  left:15%;
  animation-delay:.2s;
}

.fw2{
  left:35%;
  animation-delay:1.4s;
}

.fw3{
  left:50%;
  animation-delay:.7s;
}

.fw4{
  left:70%;
  animation-delay:1.9s;
}

.fw5{
  left:88%;
  animation-delay:1.1s;
}

@keyframes fireworkRise{

  0%{
    bottom:-20px;
    opacity:0;
  }

  10%{
    opacity:1;
  }

  55%{
    bottom:55%;
    opacity:1;
  }

  60%,100%{
    bottom:55%;
    opacity:0;
  }
}

@keyframes fireworksBurst{

  0%,55%{
    transform:scale(.1);
    opacity:0;
  }

  65%{
    transform:scale(1);
    opacity:1;
  }

  100%{
    transform:scale(1.8);
    opacity:0;
  }
}
